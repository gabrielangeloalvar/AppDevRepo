<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload to Private GitHub Repo</title>
    <link rel="stylesheet" href="sample_save.css">
</head>

<body>

    <h1>GitHub File Uploader</h1>

    <!-- Upload controls -->
    <div class="upload-container">
        <input type="file" id="fileInput" />
        <button class="upload-btn" onclick="uploadFile()">Upload</button>
    </div>

    <!-- Status display -->
    <div id="status-container">Select a file and click Upload...</div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status-container');

            if (!fileInput.files.length) {
                status.innerHTML = '<p class="warning-text">Please select a file first.</p>';
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // Show loading state
            status.innerHTML = '<div class="spinner"></div><p class="status-text">Uploading ' + file.name + '...</p>';

            reader.onload = async function (event) {
                const content = event.target.result.split(',')[1]; // Get base64 data

                // Replace with your GitHub credentials
                const githubUsername = 'gabrielangeloalvar';
                const repo = 'AppDevRepo';
                const path = `${file.name}`; // Path inside the repo
                const token = "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";

                const apiUrl = `https://api.github.com/repos/${githubUsername}/${repo}/contents/${path}`;

                const data = {
                    message: `Adding ${file.name} to private repo`,
                    content: content
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${token}`,  // Authenticate using PAT
                            "Accept": "application/vnd.github.v3+json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    if (response.ok) {
                        status.innerHTML = '<p class="success-text">File uploaded successfully! <a href="' + result.content.html_url + '" target="_blank">View it here</a></p>';
                    } else {
                        status.innerHTML = '<p class="error-text">Error: ' + result.message + '</p>';
                    }
                } catch (error) {
                    console.error("Error uploading file:", error);
                    status.innerHTML = '<p class="error-text">Upload failed. Check console for details.</p>';
                }
            };

            reader.readAsDataURL(file);
        }
    </script>

</body>

</html>
